name: CI - DevSecOps Pipeline

on:
  push:
    branches:
      - master
      - develop
      - staging
      - production
  pull_request:
    branches:
      - master
      - develop
      - staging
      - production

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validar interpretação da aplicação
        run: |
          PYTHONPATH=todo_project python -m py_compile todo_project/run.py

      - name: Executar testes automatizados
        run: |
          PYTHONPATH=todo_project pytest -q
      - name: Análise estática com Bandit
        run: |
          pip install bandit
          bandit -r todo_project || true

      - name: Análise de dependências com pip-audit
        run: |
          pip install pip-audit
          pip-audit || true
